[package]
name = "isr-figures"
version = "0.1.0"
edition = "2024"
default-run = "isr-figures"
[dependencies]
anyhow = "1"
rustplotlib = { git = "https://github.com/jvierine/rustplotlib.git", rev = "96e8aaafce8607f8aa506cd59089255a904fc499" }
hdf5 = { package = "hdf5-metno", version = "0.12" }
image = { version = "0.25", default-features = false, features = ["png"] }
